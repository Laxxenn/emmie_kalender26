<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title"></h1>
    <p id="subtitle" class="subtitle"></p>
    <p id="status" class="status" aria-live="polite"></p>
  </header>

  <main>
    <ol id="grid" class="grid"></ol>
  </main>

  <dialog id="panel" aria-labelledby="panel-title">
    <article class="card">
      <div class="card-head">
        <p id="panel-date" class="date"></p>
        <button id="panel-close" class="close" type="button">Close</button>
      </div>
      <h2 id="panel-title"></h2>
      <p id="panel-message" class="message"></p>
      <figure id="panel-figure" class="figure" hidden>
        <img id="panel-image" alt="">
      </figure>
      <div id="panel-qr" class="qr" hidden>
        <div id="panel-qr-art" class="qr-art"></div>
        <p class="qr-note">Scan with your phone camera</p>
        <a id="panel-link" class="button" href="#" target="_blank" rel="noopener" hidden>Open link</a>
      </div>
      <p id="panel-empty" class="empty" hidden>Nothing behind this door yet.</p>
    </article>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="days.js"></script>
  <script src="app.js"></script>
</body>
</html>
